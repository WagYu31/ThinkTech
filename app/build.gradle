plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def localProps = new java.util.Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def tuyaAppKey = localProps.getProperty("TUYA_APP_KEY", System.getenv("TUYA_APP_KEY") ?: "YOUR_TUYA_APP_KEY")
def tuyaAppSecret = localProps.getProperty("TUYA_APP_SECRET", System.getenv("TUYA_APP_SECRET") ?: "YOUR_TUYA_APP_SECRET")

android {
    namespace 'com.thinktech.smarthome'
    compileSdk 34

    defaultConfig {
        applicationId "com.thinktech.iot.smarthome"
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName "1.0.9"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [
            TUYA_APP_KEY   : tuyaAppKey,
            TUYA_APP_SECRET: tuyaAppSecret
        ]

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        jniLibs {
            pickFirsts += [
                'lib/*/libc++_shared.so',
                'lib/*/libyuv.so',
                'lib/*/libopenh264.so'
            ]
        }
        resources {
            pickFirsts += [
                'lib/*/libc++_shared.so',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties'
            ]
        }
    }
}

configurations.all {
    exclude group: "com.thingclips.smart", module: 'thingsmart-modularCampAnno'
}

dependencies {
    // Security Algorithm AAR (Tuya SDK 7.8.0)
    implementation fileTree(dir: 'libs', include: ['*.aar'])

    // Core Tuya / Thing Smart Life App SDK (v7.8.0) & IPC Camera P2P SDK (v7.8.2 hotfix restores missing libThingInferenceSDK.so & libopus.so)
    implementation 'com.thingclips.smart:thingsmart:7.8.0'
    implementation 'com.thingclips.smart:thingsmart-ipcsdk:7.8.2'
    implementation 'com.alibaba:fastjson:1.1.67.android'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:3.14.9'
    implementation 'com.google.zxing:core:3.5.3'

    // AndroidX & UI Components
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.airbnb.android:lottie:6.4.1'

    // Architecture Lifecycle & Coroutines
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
